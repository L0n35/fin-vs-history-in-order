name: Build and deploy

on:
  push:
    branches: [main]
  # Episodes come out around 03:00–04:00 UTC on Mondays and Thursdays. A daily run catches them, plus any re-titles.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test the data pipeline
        run: npm test

      - name: Fetch the latest episodes
        run: npm run feed

      - name: Report undated episodes
        run: npm run report >> "$GITHUB_STEP_SUMMARY"

      - name: Build the site
        run: npx nuxt generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
